[repository]
name = "hyprphysics"
authors = ["Claude"]
# hyprpm pins a known-good Hyprland commit per plugin commit. Update the pair
# below (plugin commit, Hyprland commit) whenever you tag a release that's
# been tested against a specific Hyprland build. Left unpinned for now, which
# tells hyprpm to build against whatever Hyprland is currently running.
commit_pins = []

[hyprphysics]
description = "Gravity, bouncing, and throwable windows for Hyprland"
authors = ["Claude"]
output = "hyprphysics.so"
build = [
    "make all",
]
